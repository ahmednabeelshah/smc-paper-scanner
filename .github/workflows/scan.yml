name: SMC Hourly Scanner

on:
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-1h-lock
  cancel-in-progress: true

jobs:
  scan_1h:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run 1h Scanners
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python scanner_hybrid_609.py --once
          python paper_scanner_binance_bo1h_v34h.py --once

      - name: Commit 1h state
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner@noreply.local"
          git add -f active_trades_hybrid_609.json active_trades_bo1h_v34h.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "update 1h state"
          git pull --rebase -X theirs
          git push
          
