name: SMC Paper Scanner

on:
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-lock
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run 4-Model Binance Suite & Master Logger
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python scanner_calm_res.py
          python scanner_tsmom.py
          python scanner_4h_res_414.py
          python scanner_hybrid_609.py
          python master_trade_logger.py
          python scanner_weekly_report.py

      - name: Commit updated state & logs
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner@noreply.local"
          git add active_trades_*.json master_trade_log.csv master_trade_log.json state_weekly_report.json || true
          git commit -m "update state" || exit 0
          git pull --rebase -X theirs
          git push
          
