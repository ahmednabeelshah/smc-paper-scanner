name: SMC Paper Scanner

on:
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-lock
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run Binance Suite & Master Logger
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          for f in scanner_*.py; do
            [ -e "$f" ] || continue
            [ "$f" = "scanner_weekly_report.py" ] && continue
            echo "Running $f..."
            python "$f"
          done

          if [ -f "paper_scanner_binance_bo1h_v34h.py" ]; then
            echo "Running paper_scanner_binance_bo1h_v34h.py --once..."
            python paper_scanner_binance_bo1h_v34h.py --once
          fi

          [ -f "master_trade_logger.py" ] && python master_trade_logger.py
          [ -f "scanner_weekly_report.py" ] && python scanner_weekly_report.py

      - name: Commit updated state & logs
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner@noreply.local"
          git add -A '*.json' '*.csv' || true
          git commit -m "update state" || exit 0
          git pull --rebase -X theirs
          git push
