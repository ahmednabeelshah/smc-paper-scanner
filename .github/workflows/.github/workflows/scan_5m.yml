name: SMC 5m Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-5m-lock
  cancel-in-progress: true

jobs:
  scan_5m:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run 5m Scanner
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          date -u +"%H:%M:%S UTC - Starting 5m scan..."
          python scanner_intraday_5m.py --once
          date -u +"%H:%M:%S UTC - Finished 5m scan."

      - name: Commit 5m state & logs
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner@noreply.local"
          git add -f active_trades_5m.json closed_trades_5m.csv 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "update 5m state"
          git pull --rebase -X theirs
          git push
          
