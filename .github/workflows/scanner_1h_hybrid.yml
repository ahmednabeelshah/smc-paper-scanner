name: 1H Hybrid Short & Trailing Scanner

on:
  schedule:
    # Runs at minute :01 every hour (captures 12:00-20:00 UTC entries + hourly trailing SL & 12h/36h exit alerts)
    - cron: '1 * * * *'
  workflow_dispatch:
    inputs:
      force_report:
        description: 'Send Telegram heartbeat even if no alerts fire (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  scan-1h-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Run 1H Hybrid Scanner & Trailing Manager
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY || '100.0' }}
          FORCE_REPORT: ${{ github.event.inputs.force_report == 'true' && '1' || '0' }}
        run: |
          python scanner_1h_hybrid.py

      - name: Persist scanner state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_1h_hybrid.json
          git diff --staged --quiet || (git commit -m "chore: update 1h hybrid scanner state" && git push)
