name: 4H Crypto Signal Scanner
on:
  workflow_dispatch:
    inputs:
      force_test:
        description: "Send heartbeat even if 0 signals (1 or 0)"
        required: false
        default: "0"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas requests
      - name: Run 4H Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_EQUITY: ${{ secrets.ACCOUNT_EQUITY }}
          FORCE_TEST: ${{ github.event.inputs.force_test || '0' }}
        run: python scanner_4h_donchian_radi.py
        
